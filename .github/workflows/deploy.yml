# Elke push naar main: checks + build, en bij groen licht live op de VPS.
# Handmatig starten kan ook: tabblad Actions > Deploy > Run workflow.
#
# Benodigde repository-secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         ubuntu@<ip-van-de-vps>
#   DEPLOY_KEY          privé-helft van de deploy-sleutel (op de server vastgezet op receive-release.sh)
# De host-sleutel van de VPS is niet geheim en staat hieronder in VPS_HOST_KEY (gekoppeld aan de
# naam 'portfolio-vps' via HostKeyAlias, zodat het IP-adres niet in de repo staat).
# Opnieuw ophalen na een herinstallatie van de server: ssh-keyscan -t ed25519 <ip>
# Optioneel, als repository-variabelen (geen secrets, ze komen toch in de browser-bundle):
#   VITE_EMAILJS_SERVICE_ID, VITE_EMAILJS_TEMPLATE_ID, VITE_EMAILJS_PUBLIC_KEY
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nooit twee deploys tegelijk; een nieuwere push wacht netjes tot de vorige klaar is
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Typecheck, lint, tests en build
        run: npm run check
        env:
          VITE_SITE_URL: https://www.jaouadmchichi.nl
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Uploaden en live zetten
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILThnbDqDlWQ2LsNblVmCWPxHq1aztlYg6HTNl2vNp/8
        run: |
          install -m 700 -d ~/.ssh
          # Plakken in de browser kan \r of spaties meegeven; die eruit halen
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'portfolio-vps %s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          host=$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n\t ')

          # Eerst de secrets controleren, met een duidelijke foutmelding in plaats van een kale exitcode 255
          ok=1
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_KEY is geen geldige privésleutel (verwacht: het hele bestand, van -----BEGIN tot en met -----END)"; ok=0
          fi
          case "$host" in *@*) ;; *) echo "::error::DEPLOY_HOST moet de vorm gebruiker@host hebben"; ok=0 ;; esac
          [ "$ok" = 1 ] || exit 1

          if ! timeout 15 bash -c "</dev/tcp/${host#*@}/22" 2>/dev/null; then
            echo "::error::Poort 22 van de VPS is niet bereikbaar vanaf de runner (firewall?)"; exit 1
          fi

          # De server draait voor deze sleutel altijd receive-release.sh; dat leest de tarball van stdin.
          # Foutuitvoer van ssh komt bij een mislukking als melding in de samenvatting van de run.
          set +e
          tar -czf - -C dist . | ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o HostKeyAlias=portfolio-vps -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 "$host" 2> ssh.err
          code=${PIPESTATUS[1]}
          set -e
          cat ssh.err >&2
          if [ "$code" != 0 ]; then
            grep -v '^\s*$' ssh.err | tail -5 | while IFS= read -r line; do echo "::error::ssh: $line"; done
            exit "$code"
          fi
